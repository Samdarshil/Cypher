[project]
name = "cypher"
version = "0.1.0"
description = "Local-first CTF intelligence and analysis system"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cypher = "cypher.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
